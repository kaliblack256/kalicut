# Build KALICUT for macOS:
#   - Apple Silicon (M1–M4): macos-14 arm64
#   - Intel: macos-13 x86_64
#
# Signing: ad-hoc by default; Developer ID via secrets (docs/MACOS_SIGNING.md)
name: macOS

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  release:
    types: [published]

jobs:
  package:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
            rust_target: aarch64-apple-darwin
            artifact_name: kalicut-macos-arm64
            artifact_glob: kalicut-*-macos-arm64.tar.gz
          - os: macos-13
            arch: x86_64
            rust_target: x86_64-apple-darwin
            artifact_name: kalicut-macos-x86_64
            artifact_glob: kalicut-*-macos-x86_64.tar.gz
    env:
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      NOTARIZE: ${{ secrets.NOTARIZE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Show arch
        run: |
          uname -m
          uname -a
          rustc -vV

      - name: Install Homebrew deps
        run: |
          brew update
          brew install mpv ffmpeg pkg-config
          echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          pkg-config --modversion mpv
          ffmpeg -version | head -1
          file "$(command -v ffmpeg)" || true

      - name: Import Developer ID certificate (optional)
        if: env.MACOS_CERTIFICATE_P12 != ''
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN="$RUNNER_TEMP/kalicut.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" $(security list-keychain -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN"
          echo "SIGN_MODE=identity" >> "$GITHUB_ENV"
          echo "CODESIGN_IDENTITY=$MACOS_CODESIGN_IDENTITY" >> "$GITHUB_ENV"
          echo "ENTITLEMENTS=$GITHUB_WORKSPACE/packaging/macos/entitlements.plist" >> "$GITHUB_ENV"

      - name: Default ad-hoc signing
        if: env.MACOS_CERTIFICATE_P12 == ''
        run: |
          echo "SIGN_MODE=adhoc" >> "$GITHUB_ENV"
          echo "No MACOS_CERTIFICATE_P12 — ad-hoc codesign"

      - name: Build & package
        run: |
          chmod +x scripts/*.sh
          export SIGN_MODE="${SIGN_MODE:-adhoc}"
          export CODESIGN_IDENTITY="${CODESIGN_IDENTITY:-}"
          export ENTITLEMENTS="${ENTITLEMENTS:-}"
          export NOTARIZE="${NOTARIZE:-0}"
          export APPLE_ID="${APPLE_ID:-}"
          export APPLE_TEAM_ID="${APPLE_TEAM_ID:-}"
          export APPLE_APP_PASSWORD="${APPLE_APP_PASSWORD:-}"
          ./scripts/package-macos.sh
          # Sanity: archive name matches matrix arch
          ls -lh dist/
          test -f dist/kalicut-*-macos-${{ matrix.arch }}.tar.gz

      - name: Checksums
        run: |
          cd dist
          ART="$(ls -1 ${{ matrix.artifact_glob }} | head -1)"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ART" | tee "${ART}.sha256"
          else
            shasum -a 256 "$ART" | tee "${ART}.sha256"
          fi
          test -s "${ART}.sha256"
          ls -lh "$ART" "${ART}.sha256"
          tar -xOf "$ART" "*/SIGNING.txt" 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/${{ matrix.artifact_glob }}
            dist/${{ matrix.artifact_glob }}.sha256
          if-no-files-found: error

      - name: Attach to GitHub Release (on tags)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          ART="$(ls -1 dist/${{ matrix.artifact_glob }} | head -1)"
          SUM="${ART}.sha256"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "KALICUT ${TAG}" \
              --notes "macOS ${{ matrix.arch }} package attached by CI." \
              "$ART" "$SUM"
          else
            gh release upload "$TAG" "$ART" "$SUM" --clobber
          fi
