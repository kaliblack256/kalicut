# Build KALICUT for Apple Silicon (M1–M4 / arm64) on GitHub-hosted macOS.
#
# Triggers:
#   - workflow_dispatch (manual)
#   - push of tags v*
#   - release published (optional upload)
name: macOS arm64

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  release:
    types: [published]

jobs:
  macos-arm64:
    name: Build macOS arm64 package
    runs-on: macos-14 # Apple Silicon runner
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install Homebrew deps
        run: |
          brew update
          brew install mpv ffmpeg pkg-config
          echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          pkg-config --modversion mpv
          ffmpeg -version | head -1

      - name: Build & package
        run: |
          chmod +x scripts/*.sh
          ./scripts/package-macos.sh

      - name: Checksums
        run: |
          cd dist
          ART="$(ls -1 kalicut-*-macos-arm64.tar.gz | head -1)"
          # macOS ships shasum; Linux CI would use sha256sum
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ART" | tee "${ART}.sha256"
          else
            shasum -a 256 "$ART" | tee "${ART}.sha256"
          fi
          test -s "${ART}.sha256"
          ls -lh "$ART" "${ART}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kalicut-macos-arm64
          path: |
            dist/kalicut-*-macos-arm64.tar.gz
            dist/kalicut-*-macos-arm64.tar.gz.sha256
          if-no-files-found: error

      - name: Attach to GitHub Release (on tags)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          ART="$(ls -1 dist/kalicut-*-macos-arm64.tar.gz | head -1)"
          SUM="${ART}.sha256"
          # Create release if missing, else upload assets
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "KALICUT ${TAG}" \
              --notes "macOS arm64 (Apple Silicon) package attached by CI." \
              "$ART" "$SUM"
          else
            gh release upload "$TAG" "$ART" "$SUM" --clobber
          fi
