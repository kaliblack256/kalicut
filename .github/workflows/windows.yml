# Self-contained Windows x64 portable zip for Win10/11.
# Bundles libmpv-2.dll + ffmpeg/ffprobe. Optional Authenticode via secrets.
name: Windows

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Attach built zip to this release tag (e.g. v0.1.1). Leave empty to only build artifact."
        required: false
        default: ""
  push:
    tags:
      - "v*"
  release:
    types: [published]

jobs:
  windows-x64:
    name: Windows x64 portable
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
      WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
      WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build package (libmpv + optional sign)
        shell: pwsh
        run: |
          ./scripts/package-windows.ps1
          Get-Content dist/kalicut-*-windows-x86_64/SIGNING.txt -ErrorAction SilentlyContinue
          Get-ChildItem dist/kalicut-*-windows-x86_64 | Format-Table Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kalicut-windows-x86_64
          path: |
            dist/kalicut-*-windows-x86_64.zip
            dist/kalicut-*-windows-x86_64.zip.sha256
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and '${{ inputs.release_tag }}') {
            '${{ inputs.release_tag }}'
          } else {
            $env:GITHUB_REF_NAME
          }
          Write-Host "Attach to release tag: $tag"
          $zip = (Get-ChildItem dist/kalicut-*-windows-x86_64.zip | Select-Object -First 1).FullName
          $sum = "$zip.sha256"
          $plainSum = Join-Path (Split-Path $zip) ((Split-Path $zip -Leaf) -replace '\.zip$','.SHA256SUMS.txt')
          Copy-Item $sum $plainSum -Force
          # Delete incomplete "starter" / previous windows assets that block re-upload
          $json = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" 2>$null
          if ($json) {
            $assets = $json | ConvertFrom-Json | Select-Object -ExpandProperty assets
            foreach ($a in $assets) {
              $n = $a.name
              if ($a.state -ne 'uploaded' -or $n -match 'windows|win64') {
                Write-Host "DELETE asset $($a.id) $n ($($a.state))"
                gh api -X DELETE "repos/$env:GITHUB_REPOSITORY/releases/assets/$($a.id)" 2>$null | Out-Null
              }
            }
          }
          if (gh release view $tag 2>$null) {
            gh release upload $tag $zip $plainSum --clobber
          } else {
            gh release create $tag --title "KALICUT $tag" --notes "Windows x64 portable (libmpv + ffmpeg)" $zip $plainSum
          }
          gh release view $tag --json assets --jq '.assets[] | select(.name|test("windows")) | "\(.name) \(.size)"'
