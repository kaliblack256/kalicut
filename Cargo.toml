[package]
name = "kalicut"
version = "0.1.1"
edition = "2021"
description = "KALICUT — GUI for lossless audio/video cutting with ffmpeg"
license = "MIT"
default-run = "kalicut"
readme = "README.md"
keywords = ["ffmpeg", "audio", "video", "trim", "gui"]
categories = ["multimedia", "gui"]
exclude = ["target/*", "dist/*"]

[[bin]]
name = "kalicut"
path = "src/main.rs"

[[bin]]
name = "kalicut_selftest"
path = "src/bin/kalicut_selftest.rs"

[features]
default = ["embedded-mpv"]
# Embedded libmpv SW preview (Linux/macOS/Windows packages).
# Windows: package-windows.ps1 downloads libmpv-2.dll + builds import lib.
# Fallback: cargo build --no-default-features → ffmpeg preview only.
embedded-mpv = ["dep:libmpv2", "dep:libmpv2-sys"]

[dependencies]
eframe = { version = "0.31", default-features = true, features = ["default_fonts", "glow"] }
egui = "0.31"
libmpv2 = { version = "5", optional = true }
libmpv2-sys = { version = "4", optional = true }
rfd = "0.15"
rodio = { version = "0.20", default-features = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Smaller binaries, fewer host absolute paths left in the ELF
[profile.release]
strip = true
codegen-units = 1
