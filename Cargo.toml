[package]
name = "kalicut"
version = "0.1.1"
edition = "2021"
description = "KALICUT — GUI for lossless audio/video cutting with ffmpeg"
license = "MIT"
default-run = "kalicut"
readme = "README.md"
keywords = ["ffmpeg", "audio", "video", "trim", "gui"]
categories = ["multimedia", "gui"]
exclude = ["target/*", "dist/*"]

[[bin]]
name = "kalicut"
path = "src/main.rs"

[[bin]]
name = "kalicut_selftest"
path = "src/bin/kalicut_selftest.rs"

[dependencies]
eframe = { version = "0.31", default-features = true, features = ["default_fonts", "glow"] }
egui = "0.31"
libmpv2 = "5"
libmpv2-sys = "4"
rfd = "0.15"
rodio = { version = "0.20", default-features = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Smaller binaries, fewer host absolute paths left in the ELF
[profile.release]
strip = true
codegen-units = 1
